
services:
  postgres:
    image: postgres:17-alpine
    container_name: sim-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: incident_management
      POSTGRES_USER: ${DB_USERNAME:-incident_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
