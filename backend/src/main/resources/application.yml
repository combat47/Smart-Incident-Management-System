
spring:
  application:
    name: smart-incident-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/incident_management}
    username: ${DB_USERNAME:incident_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: incident_management

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: incident_management
    default-schema: incident_management
    create-schemas: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
